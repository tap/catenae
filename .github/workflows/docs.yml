# Copyright 2026 Timothy Place and the catenae contributors
#
# The site (D46, PLAN.md section 11): the guide (mdBook) at / and the reference (Doxygen) at
# /api/, built on every pull request with every warning an error and every internal link
# checked (scripts/build_site.sh), and published to GitHub Pages from main. Carried from
# SampleRateTap's book-pages.yml and its ci.yml book job (NOTICE.md); catenae has no print
# edition (D46).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_URL: https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz
  MDBOOK_SHA256: "9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b"

jobs:
  build:
    name: Guide and reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Doxygen
        run: scripts/apt_install.sh --no-install-recommends doxygen

      - name: Install mdBook (pinned)
        run: |
          curl -sfLo /tmp/mdbook.tar.gz "$MDBOOK_URL"
          echo "$MDBOOK_SHA256  /tmp/mdbook.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/mdbook.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          doxygen --version
          mdbook --version

      - name: Build the site (warnings are errors, links checked)
        run: scripts/build_site.sh

      - name: Upload the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build-docs/site

  # The site is public (https://tap.github.io/catenae/). If the first deployment complains,
  # the repository's Settings, Pages, Source must be "GitHub Actions"; configure-pages tries
  # to set it itself.
  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
