<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">A bursting region and its steady form, call by call</title>
<desc id="d">8 calls of 64 frames. The bare region writes 0 or 128 frames a call. Inside steady, a FIFO that starts with 127 frames of silence holds 63 or 127 frames after each call, and 64 frames are handed back on every call.</desc>
<style>
  .surface { fill: #fcfcfb; }
  .title   { fill: #0b0b0b; font-size: 14px; font-weight: 600; }
  .note    { fill: #52514e; font-size: 12px; }
  .value   { fill: #0b0b0b; font-size: 12px; font-variant-numeric: tabular-nums; }
  .axis    { fill: #52514e; font-size: 12px; font-variant-numeric: tabular-nums; }
  .base    { stroke: #d9d8d2; stroke-width: 1; }
  .bar     { fill: #1E9A98; }
  .none    { stroke: #1E9A98; stroke-width: 2; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .title, .value { fill: #f0efec; }
    .note, .axis { fill: #c3c2b7; }
    .base { stroke: #3a3a37; }
  }
</style>
<rect class="surface" width="720" height="590"/>
<text class="title" x="24" y="30">Frames the caller passes in</text>
<text class="note" x="24" y="47">64 on every call</text>
<line class="base" x1="24" y1="140" x2="696" y2="140"/>
<path class="bar" d="M44.0 140 V116.0 Q44.0 112.0 48.0 112.0 H84.0 Q88.0 112.0 88.0 116.0 V140 Z"><title>call 1: 64 frames</title></path>
<text class="value" x="66.0" y="106.0" text-anchor="middle">64</text>
<path class="bar" d="M128.0 140 V116.0 Q128.0 112.0 132.0 112.0 H168.0 Q172.0 112.0 172.0 116.0 V140 Z"><title>call 2: 64 frames</title></path>
<path class="bar" d="M212.0 140 V116.0 Q212.0 112.0 216.0 112.0 H252.0 Q256.0 112.0 256.0 116.0 V140 Z"><title>call 3: 64 frames</title></path>
<path class="bar" d="M296.0 140 V116.0 Q296.0 112.0 300.0 112.0 H336.0 Q340.0 112.0 340.0 116.0 V140 Z"><title>call 4: 64 frames</title></path>
<path class="bar" d="M380.0 140 V116.0 Q380.0 112.0 384.0 112.0 H420.0 Q424.0 112.0 424.0 116.0 V140 Z"><title>call 5: 64 frames</title></path>
<path class="bar" d="M464.0 140 V116.0 Q464.0 112.0 468.0 112.0 H504.0 Q508.0 112.0 508.0 116.0 V140 Z"><title>call 6: 64 frames</title></path>
<path class="bar" d="M548.0 140 V116.0 Q548.0 112.0 552.0 112.0 H588.0 Q592.0 112.0 592.0 116.0 V140 Z"><title>call 7: 64 frames</title></path>
<path class="bar" d="M632.0 140 V116.0 Q632.0 112.0 636.0 112.0 H672.0 Q676.0 112.0 676.0 116.0 V140 Z"><title>call 8: 64 frames</title></path>
<text class="title" x="24" y="166">Frames the bare region writes</text>
<text class="note" x="24" y="183">nothing, then a whole hop of 128</text>
<line class="base" x1="24" y1="276" x2="696" y2="276"/>
<line class="none" x1="52.0" y1="275" x2="80.0" y2="275"><title>call 1: 0 frames</title></line>
<text class="value" x="66.0" y="270.0" text-anchor="middle">0</text>
<path class="bar" d="M128.0 276 V224.0 Q128.0 220.0 132.0 220.0 H168.0 Q172.0 220.0 172.0 224.0 V276 Z"><title>call 2: 128 frames</title></path>
<text class="value" x="150.0" y="214.0" text-anchor="middle">128</text>
<line class="none" x1="220.0" y1="275" x2="248.0" y2="275"><title>call 3: 0 frames</title></line>
<path class="bar" d="M296.0 276 V224.0 Q296.0 220.0 300.0 220.0 H336.0 Q340.0 220.0 340.0 224.0 V276 Z"><title>call 4: 128 frames</title></path>
<line class="none" x1="388.0" y1="275" x2="416.0" y2="275"><title>call 5: 0 frames</title></line>
<path class="bar" d="M464.0 276 V224.0 Q464.0 220.0 468.0 220.0 H504.0 Q508.0 220.0 508.0 224.0 V276 Z"><title>call 6: 128 frames</title></path>
<line class="none" x1="556.0" y1="275" x2="584.0" y2="275"><title>call 7: 0 frames</title></line>
<path class="bar" d="M632.0 276 V224.0 Q632.0 220.0 636.0 220.0 H672.0 Q676.0 220.0 676.0 224.0 V276 Z"><title>call 8: 128 frames</title></path>
<text class="title" x="24" y="302">Frames waiting in steady&lt;&gt;&#x27;s FIFO after the call</text>
<text class="note" x="24" y="319">it starts with 127 frames of silence: the added latency</text>
<line class="base" x1="24" y1="412" x2="696" y2="412"/>
<path class="bar" d="M44.0 412 V388.4 Q44.0 384.4 48.0 384.4 H84.0 Q88.0 384.4 88.0 388.4 V412 Z"><title>call 1: 63 frames</title></path>
<text class="value" x="66.0" y="378.4" text-anchor="middle">63</text>
<path class="bar" d="M128.0 412 V360.4 Q128.0 356.4 132.0 356.4 H168.0 Q172.0 356.4 172.0 360.4 V412 Z"><title>call 2: 127 frames</title></path>
<text class="value" x="150.0" y="350.4" text-anchor="middle">127</text>
<path class="bar" d="M212.0 412 V388.4 Q212.0 384.4 216.0 384.4 H252.0 Q256.0 384.4 256.0 388.4 V412 Z"><title>call 3: 63 frames</title></path>
<path class="bar" d="M296.0 412 V360.4 Q296.0 356.4 300.0 356.4 H336.0 Q340.0 356.4 340.0 360.4 V412 Z"><title>call 4: 127 frames</title></path>
<path class="bar" d="M380.0 412 V388.4 Q380.0 384.4 384.0 384.4 H420.0 Q424.0 384.4 424.0 388.4 V412 Z"><title>call 5: 63 frames</title></path>
<path class="bar" d="M464.0 412 V360.4 Q464.0 356.4 468.0 356.4 H504.0 Q508.0 356.4 508.0 360.4 V412 Z"><title>call 6: 127 frames</title></path>
<path class="bar" d="M548.0 412 V388.4 Q548.0 384.4 552.0 384.4 H588.0 Q592.0 384.4 592.0 388.4 V412 Z"><title>call 7: 63 frames</title></path>
<path class="bar" d="M632.0 412 V360.4 Q632.0 356.4 636.0 356.4 H672.0 Q676.0 356.4 676.0 360.4 V412 Z"><title>call 8: 127 frames</title></path>
<text class="title" x="24" y="438">Frames steady&lt;&gt; hands back</text>
<text class="note" x="24" y="455">64 on every call</text>
<line class="base" x1="24" y1="548" x2="696" y2="548"/>
<path class="bar" d="M44.0 548 V524.0 Q44.0 520.0 48.0 520.0 H84.0 Q88.0 520.0 88.0 524.0 V548 Z"><title>call 1: 64 frames</title></path>
<text class="value" x="66.0" y="514.0" text-anchor="middle">64</text>
<path class="bar" d="M128.0 548 V524.0 Q128.0 520.0 132.0 520.0 H168.0 Q172.0 520.0 172.0 524.0 V548 Z"><title>call 2: 64 frames</title></path>
<path class="bar" d="M212.0 548 V524.0 Q212.0 520.0 216.0 520.0 H252.0 Q256.0 520.0 256.0 524.0 V548 Z"><title>call 3: 64 frames</title></path>
<path class="bar" d="M296.0 548 V524.0 Q296.0 520.0 300.0 520.0 H336.0 Q340.0 520.0 340.0 524.0 V548 Z"><title>call 4: 64 frames</title></path>
<path class="bar" d="M380.0 548 V524.0 Q380.0 520.0 384.0 520.0 H420.0 Q424.0 520.0 424.0 524.0 V548 Z"><title>call 5: 64 frames</title></path>
<path class="bar" d="M464.0 548 V524.0 Q464.0 520.0 468.0 520.0 H504.0 Q508.0 520.0 508.0 524.0 V548 Z"><title>call 6: 64 frames</title></path>
<path class="bar" d="M548.0 548 V524.0 Q548.0 520.0 552.0 520.0 H588.0 Q592.0 520.0 592.0 524.0 V548 Z"><title>call 7: 64 frames</title></path>
<path class="bar" d="M632.0 548 V524.0 Q632.0 520.0 636.0 520.0 H672.0 Q676.0 520.0 676.0 524.0 V548 Z"><title>call 8: 64 frames</title></path>
<text class="axis" x="66.0" y="574" text-anchor="middle">call 1</text>
<text class="axis" x="150.0" y="574" text-anchor="middle">call 2</text>
<text class="axis" x="234.0" y="574" text-anchor="middle">call 3</text>
<text class="axis" x="318.0" y="574" text-anchor="middle">call 4</text>
<text class="axis" x="402.0" y="574" text-anchor="middle">call 5</text>
<text class="axis" x="486.0" y="574" text-anchor="middle">call 6</text>
<text class="axis" x="570.0" y="574" text-anchor="middle">call 7</text>
<text class="axis" x="654.0" y="574" text-anchor="middle">call 8</text>
</svg>
